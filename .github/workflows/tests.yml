name: tests

on:
  push:
  pull_request:

jobs:
  unittest:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Compile modules
        run: python -m py_compile app.py pipeline_manager.py youtube_uploader.py database.py render_engine.py scanner_downloader.py ai_engine.py config.py
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
