name: tests

on:
  push:
  pull_request:

jobs:
  unittest:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Compile modules
        run: >-
          python -m py_compile
          app.py api_security.py antidetect_client.py pipeline_manager.py
          youtube_uploader.py database.py render_engine.py scanner_downloader.py
          ai_engine.py config.py check_status.py
      - name: Check frontend syntax
        run: node --check static/app.js
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Install browser for DOM regressions
        run: python -m playwright install chromium
      - name: Run browser regressions
        env:
          DHB_BROWSER_TESTS: '1'
        run: python -m unittest discover -s tests -p test_review_browser.py -v

  media:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.10'
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Install FFmpeg
        run: choco install ffmpeg --no-progress -y
      - name: Run actual media matrix
        env:
          DHB_MEDIA_TESTS: '1'
          DHB_MEDIA_REPORT: media-results.json
        run: python -m unittest discover -s tests -p test_review_media.py -v
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: media-results
          path: media-results.json
