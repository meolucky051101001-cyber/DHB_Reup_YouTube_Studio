<!doctype html>
<html lang="vi"><meta charset="utf-8"><title>Synthetic spoken language contract fixture</title>
<body>
<p>Fixture tự tạo; không phải DOM được thu từ YouTube Studio.</p>
<button data-action="show-more" onclick="setTimeout(() => document.querySelector('[data-details]').hidden=false, 25)">Hiện thêm</button>
<div data-details hidden>
  <section data-studio-section="caption_certification"><label>Ngôn ngữ video</label><select data-semantic="caption-certification"><option value="not-applicable">Không áp dụng</option></select></section>
  <section data-studio-section="title_language"><label>Ngôn ngữ video</label><select data-semantic="title-language"><option value="title-language-en">Tiếng Anh</option></select></section>
  <section data-studio-section="video_language">
    <label for="video-language">Ngôn ngữ video</label>
    <select id="video-language" data-semantic="video-language" onchange="if (this.dataset.noChange) this.value='spoken-en'">
      <option value="spoken-en">Tiếng Anh</option><option value="spoken-en-us">Tiếng Anh (Hoa Kỳ)</option><option value="spoken-vi">Tiếng Việt</option>
    </select>
  </section>
</div>
</body></html>
